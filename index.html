<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cacheta Master">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Cacheta Master</title>
</head>
<body>
<header>
  <div>
    <small>PLACAR OFICIAL</small>
    <h1>🃏 Cacheta Master</h1>
  </div>
</header>

<main>
  <section id="inicio" class="tela ativa">
    <div class="card destaque">
      <h2>Nova partida</h2>

      <label for="nomePartida">Nome da partida <span>(opcional)</span></label>
      <input id="nomePartida" placeholder="Ex.: Churrasco dos Amigos">

      <label for="localPartida">Local <span>(opcional)</span></label>
      <input id="localPartida" placeholder="Ex.: Bar do João">

      <label>Modo de jogo</label>
      <div class="modo-grid">
        <button class="modo ativo" data-modo="rapido">Modo rápido</button>
        <button class="modo" data-modo="rodada">Modo rodada</button>
      </div>

      <div id="jogadoresInputs" class="jogadores-inputs"></div>

      <button id="adicionarJogador" class="btn secundaria">+ Adicionar jogador</button>
      <button id="iniciarPartida" class="btn primaria">Iniciar partida</button>
    </div>

    <div class="card">
      <h3>Regras</h3>
      <div class="regras">
        <span><strong>10</strong> pontos iniciais</span>
        <span><strong>-1</strong> desistiu</span>
        <span><strong>-2</strong> perdeu</span>
        <span><strong>0</strong> eliminado</span>
      </div>
    </div>
  </section>

  <section id="partida" class="tela">
    <div class="topo-partida">
      <div>
        <small id="partidaSubtitulo">Partida atual</small>
        <h2 id="partidaTitulo">Cacheta</h2>
      </div>
      <div class="rodada-badge" id="rodadaAtual">Rodada 1</div>
    </div>

    <div id="painelRapido">
      <div id="placar" class="placar"></div>
      <button id="novaRodadaRapida" class="btn secundaria largura-total">Nova rodada</button>
    </div>

    <div id="painelRodada" class="oculto">
      <div class="card">
        <h3>Resultado da rodada</h3>
        <p class="muted">Marque o resultado de cada jogador antes de confirmar.</p>
        <div id="listaResultados"></div>
        <button id="confirmarRodada" class="btn primaria">Confirmar rodada</button>
      </div>
    </div>

    <div class="acoes-partida">
      <button id="desfazer" class="btn secundaria">↶ Desfazer</button>
      <button id="encerrar" class="btn perigo">Encerrar</button>
    </div>
  </section>

  <section id="historico" class="tela">
    <div class="titulo-linha">
      <h2>Histórico</h2>
      <button id="limparHistorico" class="link-perigo">Limpar</button>
    </div>
    <div id="listaHistorico"></div>
  </section>

  <section id="ranking" class="tela">
    <h2>Ranking geral</h2>
    <div id="listaRanking"></div>
  </section>
</main>

<nav>
  <button data-tela="inicio" class="ativo">⌂<span>Início</span></button>
  <button data-tela="partida">♣<span>Partida</span></button>
  <button data-tela="historico">▤<span>Histórico</span></button>
  <button data-tela="ranking">★<span>Ranking</span></button>
</nav>

<dialog id="dialogCampeao">
  <div class="trofeu">🏆</div>
  <h2 id="nomeCampeao">Campeão!</h2>
  <p>Partida salva no histórico.</p>
  <button id="fecharCampeao" class="btn primaria">Ver resultado</button>
</dialog>

<script src="js/storage.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
</body>
</html>
